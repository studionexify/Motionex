# Publishes the Motionex web app (the same build as Cloudflare Pages, see WEB-DEPLOY.md) to GitHub Pages.
# One-time setup, by a repository admin: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The workflow's token cannot switch Pages on by itself; until it is on, the deploy step fails with
# "Get Pages site failed: Not Found".
# GitHub Pages sites of a public repository are public: Cloudflare Access and web/public/_headers do not apply here.
name: Web app (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # deploys only from the repository's default branch
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # tests already run on every push to main in ci.yml
      # the web app (plus the printer bridge download); relative paths, since Pages serves it under /<repo>/
      - run: npm run build:bridge
      - run: npx vite build -c vite.web.config.ts --base ./
      - run: cp dist-bridge/motionex-bridge.cjs dist-web/motionex-bridge.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
